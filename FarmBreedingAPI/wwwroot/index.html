<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Farm Breeding Management</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        /* LOGIN */
        .login-card {
            max-width: 420px;
            margin: 80px auto;
        }

            .login-card input {
                margin-bottom: 15px;
            }

        .login-button {
            width: 100%;
        }

        .logout-button {
            float: right;
            background: #777;
        }

            .logout-button:hover {
                background: #555;
            }

        .header {
            background: #1f4d3a;
            color: white;
            padding: 18px 30px;
        }

            .header h1 {
                margin: 0;
            }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        .search-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        input,
        select {
            padding: 11px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
            width: 100%;
            box-sizing: border-box;
        }

        .search-row input {
            width: 250px;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            background: #1f4d3a;
            color: white;
            cursor: pointer;
        }

            button:hover {
                background: #163b2d;
            }

            /* ==========================================
           DISABLED SAVE BUTTON
           ========================================== */

            button:disabled {
                background: #cccccc;
                color: #777777;
                cursor: not-allowed;
            }

                button:disabled:hover {
                    background: #cccccc;
                }

        .edit-button {
            margin-bottom: 20px;
        }

        .save-button {
            margin-top: 20px;
        }

        .cancel-button {
            margin-top: 20px;
            margin-left: 10px;
            background: #777;
        }

        .message {
            margin-top: 15px;
            padding: 10px;
            display: none;
            border-radius: 6px;
        }

        .error {
            background: #ffe5e5;
            color: #a00000;
        }

        .success {
            background: #e5f5eb;
            color: #176b3a;
        }

        .animal-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .field {
            border: 1px solid #ddd;
            padding: 12px;
            border-radius: 6px;
            background: #fafafa;
        }

            .field label {
                display: block;
                font-size: 13px;
                color: #666;
                margin-bottom: 5px;
            }

            .field value {
                font-size: 16px;
                font-weight: bold;
            }

        .edit-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .edit-field label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .edit-field input:not(.readonly),
        .edit-field select {
            background-color: #f0f8ff;
            border: 1px solid #4a90e2;
        }

            .edit-field input:not(.readonly):focus,
            .edit-field select:focus {
                background-color: #ffffff;
                border: 2px solid #1f4d3a;
                outline: none;
            }

        .edit-field input.readonly {
            background-color: #eeeeee;
            border: 1px solid #cccccc;
            color: #666666;
            cursor: not-allowed;
        }

        .edit-field input:disabled,
        .edit-field select:disabled {
            background-color: #eeeeee;
            color: #777777;
            cursor: not-allowed;
            border: 1px solid #d0d0d0;
        }

        .edit-section-note {
            margin-bottom: 18px;
            padding: 10px 14px;
            background: #f0f8ff;
            border-left: 4px solid #4a90e2;
            color: #444;
            border-radius: 4px;
            font-size: 14px;
        }

        @media (max-width: 700px) {
            .animal-grid,
            .edit-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- LOGIN -->
    <div id="loginPage" class="container">
        <div class="card login-card">
            <h2>Farm Breeding Management</h2>
            <h3>Login</h3>

            <input id="loginUsername" type="text" placeholder="User ID" />
            <input id="loginPassword" type="password" placeholder="Password" onkeydown="if(event.key === 'Enter') login();" />

            <button class="login-button" onclick="login()">Login</button>
        </div>
    </div>

    <!-- MAIN WEB PORTAL -->
    <div id="mainPage" style="display:none;">
        <div class="header">
            <h1>Farm Breeding Management</h1>
            <button class="logout-button" onclick="logout()">Logout</button>
        </div>

        <div class="container">

            <!-- ==========================================
                 SEARCH
                 ========================================== -->

            <div class="card">

                <h2>Goat Information</h2>

                <div class="search-row">

                    <input id="animalNo"
                           type="number"
                           placeholder="Enter Animal No" />

                    <button onclick="loadAnimal()">
                        Search Goat
                    </button>

                    <button onclick="printAllGoats()">
                        PDF - All Goats
                    </button>

                </div>

                <div id="message" class="message"></div>

            </div>


            <!-- ==========================================
                 ANIMAL DISPLAY
                 ========================================== -->

            <div id="animalCard"
                 class="card"
                 style="display:none;">

                <h2>Animal Details</h2>

                <button class="edit-button"
                        onclick="editAnimal()">
                    Edit Goat
                </button>

                <div class="animal-grid">

                    <div class="field">
                        <label>Animal No</label>
                        <value id="vAnimalNo">-</value>
                    </div>

                    <div class="field">
                        <label>AT Code</label>
                        <value id="vATCode">-</value>
                    </div>

                    <div class="field">
                        <label>Gender</label>
                        <value id="vGender">-</value>
                    </div>

                    <div class="field">
                        <label>Date of Birth</label>
                        <value id="vDOB">-</value>
                    </div>

                    <div class="field">
                        <label>Breed</label>
                        <value id="vBreed">-</value>
                    </div>

                    <div class="field">
                        <label>Mother Number</label>
                        <value id="vMotherNumber">-</value>
                    </div>

                    <div class="field">
                        <label>Mother Code</label>
                        <value id="vMotherCode">-</value>
                    </div>

                    <div class="field">
                        <label>Source Type</label>
                        <value id="vSourceType">-</value>
                    </div>

                    <div class="field">
                        <label>Purchase Date</label>
                        <value id="vPurchaseDate">-</value>
                    </div>

                    <div class="field">
                        <label>Price</label>
                        <value id="vPrice">-</value>
                    </div>

                    <div class="field">
                        <label>Agent Name</label>
                        <value id="vAgentName">-</value>
                    </div>

                </div>

            </div>


            <!-- ==========================================
                 EDIT
                 ========================================== -->

            <div id="editCard"
                 class="card"
                 style="display:none;">

                <h2>Edit Goat</h2>

                <div class="edit-section-note">
                    Blue fields can be edited.
                    Grey fields are read-only or automatically controlled.
                </div>

                <div class="edit-grid">

                    <!-- ANIMAL NO -->

                    <div class="edit-field">

                        <label>Animal No</label>

                        <input id="eAnimalNo"
                               class="readonly"
                               readonly />

                    </div>


                    <!-- AT CODE -->

                    <div class="edit-field">

                        <label>AT Code</label>

                        <input id="eATCode"
                               class="readonly"
                               readonly />

                    </div>


                    <!-- GENDER -->

                    <div class="edit-field">

                        <label>Gender</label>

                        <select id="eGender">

                            <option value="">
                                Select Gender
                            </option>

                            <option value="male">
                                male
                            </option>

                            <option value="female">
                                female
                            </option>

                        </select>

                    </div>


                    <!-- CATEGORY -->

                    <div class="edit-field">

                        <label>Category</label>

                        <select id="eCategory">

                            <option value="">
                                Loading...
                            </option>

                        </select>

                    </div>


                    <!-- DOB -->

                    <div class="edit-field">

                        <label>Date of Birth</label>

                        <input id="eDOB"
                               type="date" />

                    </div>


                    <!-- SOURCE TYPE -->

                    <div class="edit-field">

                        <label>Source Type</label>

                        <select id="eSourceType"
                                onchange="sourceTypeChanged()">

                            <option value="">
                                Select Source
                            </option>

                            <option value="PURCHASE">
                                PURCHASE
                            </option>

                            <option value="BORN">
                                BORN
                            </option>

                        </select>

                    </div>


                    <!-- PURCHASE DATE -->

                    <div class="edit-field">

                        <label>Purchase Date</label>

                        <input id="ePurchaseDate"
                               type="date" />

                    </div>


                    <!-- PRICE -->

                    <div class="edit-field">

                        <label>Price</label>

                        <input id="ePrice"
                               type="number"
                               step="0.01" />

                    </div>


                    <!-- AGENT -->

                    <div class="edit-field">

                        <label>Agent Name</label>

                        <input id="eAgentName"
                               type="text" />

                    </div>


                    <!-- BREED -->

                    <div class="edit-field">

                        <label>Breed</label>

                        <select id="eBreed">

                            <option value="">
                                Loading...
                            </option>

                        </select>

                    </div>


                    <!-- MOTHER NUMBER -->

                    <div class="edit-field">

                        <label>Mother Number</label>

                        <input id="eMotherNumber"
                               type="number"
                               oninput="motherNumberChanged()" />

                    </div>


                    <!-- MOTHER CODE -->

                    <div class="edit-field">

                        <label>Mother Code</label>

                        <input id="eMotherCode"
                               class="readonly"
                               readonly />

                    </div>

                </div>


                <!-- SAVE -->

                <button id="saveButton"
                        class="save-button"
                        onclick="saveAnimal()"
                        disabled>

                    Save Changes

                </button>


                <!-- CANCEL -->

                <button class="cancel-button"
                        onclick="cancelEdit()">

                    Cancel

                </button>

            </div>

        </div>
    </div>

    <script>

        let currentAnimal = null;

        // ==========================================
        // LOGIN
        // ==========================================

        async function login() {

            const username =
                document.getElementById("loginUsername").value.trim();

            const password =
                document.getElementById("loginPassword").value;

            if (!username || !password) {
                alert("Please enter User ID and Password.");
                return;
            }

            try {

                const response = await fetch(
                    "/api/auth/login",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            username: username,
                            password: password
                        })
                    }
                );

                if (!response.ok) {
                    alert("Invalid User ID or Password.");
                    return;
                }

                const result = await response.json();

                if (!result || result.success !== true) {
                    alert("Invalid User ID or Password.");
                    return;
                }

                document.getElementById("loginPage").style.display = "none";
                document.getElementById("mainPage").style.display = "block";
            }
            catch (error) {
                alert("Error connecting to API: " + error.message);
            }
        }

        function logout() {
            document.getElementById("mainPage").style.display = "none";
            document.getElementById("loginPage").style.display = "block";
            document.getElementById("loginUsername").value = "";
            document.getElementById("loginPassword").value = "";
        }

        // ==========================================
        // MOTHER VALIDATION STATE
        // ==========================================

        let motherLookupValid = true;


        // ==========================================
        // SAVE BUTTON CONTROL
        // ==========================================

        function updateSaveButton() {

            const saveButton =
                document.getElementById("saveButton");

            const sourceType =
                document.getElementById("eSourceType").value;

            const motherNumber =
                document.getElementById("eMotherNumber").value.trim();

            const motherCode =
                document.getElementById("eMotherCode").value.trim();


            // PURCHASE does not require mother

            if (sourceType === "PURCHASE") {

                saveButton.disabled = false;

                return;
            }


            // BORN requires valid mother

            if (sourceType === "BORN") {

                if (
                    motherNumber &&
                    motherCode &&
                    motherLookupValid
                ) {

                    saveButton.disabled = false;

                }
                else {

                    saveButton.disabled = true;
                }

                return;
            }


            // No source selected

            saveButton.disabled = true;
        }


        // ==========================================
        // PDF - ALL GOATS
        // ==========================================

        async function printAllGoats() {

            try {

                const response = await fetch(
                    "/api/animal/report",
                    {
                        headers: {
                            "app-version": "2"
                        }
                    }
                );

                if (!response.ok) {
                    alert("Unable to load goat report. HTTP " + response.status);
                    return;
                }

                const goats = await response.json();

                if (!Array.isArray(goats) || goats.length === 0) {
                    alert("No goat data found.");
                    return;
                }

                let rows = "";

                goats.forEach(function (goat) {

                    rows += "<tr>";
                    rows += "<td>" + (goat.animalNo ?? "-") + "</td>";
                    rows += "<td>" + (goat.atCode ?? "-") + "</td>";
                    rows += "<td>" + (goat.gender ?? "-") + "</td>";
                    rows += "<td>" + formatDate(goat.dob) + "</td>";
                    rows += "<td>" + (goat.breed ?? "-") + "</td>";
                    rows += "<td>" + (goat.sourceType ?? "-") + "</td>";
                    rows += "<td>" + formatDate(goat.purchaseDate) + "</td>";
                    rows += "<td>" + (goat.price ?? "-") + "</td>";
                    rows += "<td>" + (goat.agentName ?? "-") + "</td>";
                    rows += "<td>" + (goat.motherNumber ?? "-") + "</td>";
                    rows += "<td>" + (goat.motherCode ?? "-") + "</td>";
                    rows += "</tr>";
                });

                const reportWindow = window.open("", "_blank");

                if (!reportWindow) {
                    alert("Please allow pop-ups for this website to open the PDF report.");
                    return;
                }

                const html =
                    "<!DOCTYPE html>" +
                    "<html><head>" +
                    "<title>All Goats Report</title>" +
                    "<style>" +
                    "body{font-family:Arial,sans-serif;margin:20px;}" +
                    "h1{text-align:center;margin-bottom:5px;}" +
                    ".date{text-align:center;margin-bottom:20px;color:#555;}" +
                    "table{width:100%;border-collapse:collapse;font-size:11px;}" +
                    "th,td{border:1px solid #999;padding:5px;text-align:left;}" +
                    "th{background:#eeeeee;}" +
                    "@media print{@page{size:landscape;margin:10mm;}}" +
                    "</style></head><body>" +
                    "<h1>Farm Breeding Management</h1>" +
                    "<div class='date'>All Goats Report - " + new Date().toLocaleDateString() + "</div>" +
                    "<table><thead><tr>" +
                    "<th>Animal No</th>" +
                    "<th>AT Code</th>" +
                    "<th>Gender</th>" +
                    "<th>DOB</th>" +
                    "<th>Breed</th>" +
                    "<th>Source Type</th>" +
                    "<th>Purchase Date</th>" +
                    "<th>Price</th>" +
                    "<th>Agent Name</th>" +
                    "<th>Mother No</th>" +
                    "<th>Mother Code</th>" +
                    "</tr></thead><tbody>" +
                    rows +
                    "</tbody></table></body></html>";

                reportWindow.document.open();
                reportWindow.document.write(html);
                reportWindow.document.close();

                reportWindow.onload = function () {
                    reportWindow.focus();
                    reportWindow.print();
                };

            }
            catch (error) {
                alert("Error creating goat report: " + error.message);
            }
        }


        // ==========================================
        // SEARCH ANIMAL
        // ==========================================

        async function loadAnimal() {

            const animalNo =
                document.getElementById("animalNo").value;

            const message =
                document.getElementById("message");


            document.getElementById("animalCard").style.display =
                "none";

            document.getElementById("editCard").style.display =
                "none";

            message.style.display =
                "none";


            if (!animalNo) {

                showMessage(
                    "Please enter Animal No.",
                    true
                );

                return;
            }


            try {

                const response = await fetch(
                    `/api/animal/byanimalno/${animalNo}`,
                    {
                        headers: {
                            "app-version": "2"
                        }
                    }
                );


                if (!response.ok) {

                    showMessage(
                        response.status === 404
                            ? "Animal not found."
                            : "Unable to load animal. HTTP " +
                            response.status,
                        true
                    );

                    return;
                }


                const result =
                    await response.json();


                if (!result || !result.atCode) {

                    showMessage(
                        "Animal not found.",
                        true
                    );

                    return;
                }


                await loadAnimalDetails(
                    result.atCode
                );

            }
            catch (error) {

                showMessage(
                    "Error connecting to API: " +
                    error.message,
                    true
                );
            }
        }


        // ==========================================
        // LOAD ANIMAL DETAILS
        // ==========================================

        async function loadAnimalDetails(atCode) {

            const response = await fetch(
                `/api/animal/${encodeURIComponent(atCode)}`,
                {
                    headers: {
                        "app-version": "2"
                    }
                }
            );


            if (!response.ok) {

                showMessage(
                    "Unable to load animal details.",
                    true
                );

                return;
            }


            const animal =
                await response.json();


            currentAnimal =
                animal;


            document.getElementById("vAnimalNo").textContent =
                animal.animalNo ?? "-";


            document.getElementById("vATCode").textContent =
                animal.atCode ?? "-";


            document.getElementById("vGender").textContent =
                animal.gender ?? "-";


            document.getElementById("vDOB").textContent =
                formatDate(animal.dob);


            document.getElementById("vBreed").textContent =
                animal.breed ?? "-";


            document.getElementById("vMotherNumber").textContent =
                animal.motherNumber ?? "-";


            document.getElementById("vMotherCode").textContent =
                animal.motherCode ?? "-";


            document.getElementById("vSourceType").textContent =
                animal.sourceType ?? "-";


            document.getElementById("vPurchaseDate").textContent =
                formatDate(animal.purchaseDate);


            document.getElementById("vPrice").textContent =
                animal.price ?? "-";


            document.getElementById("vAgentName").textContent =
                animal.agentName ?? "-";


            document.getElementById("animalCard").style.display =
                "block";


            showMessage(
                "Goat loaded successfully.",
                false
            );
        }


        // ==========================================
        // OPEN EDIT MODE
        // ==========================================

        async function editAnimal() {

            if (!currentAnimal) {
                return;
            }


            document.getElementById("eAnimalNo").value =
                currentAnimal.animalNo ?? "";


            document.getElementById("eATCode").value =
                currentAnimal.atCode ?? "";


            document.getElementById("eGender").value =
                currentAnimal.gender ?? "";


            document.getElementById("eDOB").value =
                toInputDate(currentAnimal.dob);


            document.getElementById("eSourceType").value =
                currentAnimal.sourceType ?? "";


            document.getElementById("ePurchaseDate").value =
                toInputDate(currentAnimal.purchaseDate);


            document.getElementById("ePrice").value =
                currentAnimal.price ?? "";


            document.getElementById("eAgentName").value =
                currentAnimal.agentName ?? "";


            document.getElementById("eMotherNumber").value =
                currentAnimal.motherNumber ?? "";


            document.getElementById("eMotherCode").value =
                currentAnimal.motherCode ?? "";


            // Existing mother is considered valid
            // until user changes Mother Number.

            motherLookupValid =
                !!currentAnimal.motherCode;


            await loadCategories();

            await loadBreeds();


            document.getElementById("eCategory").value =
                currentAnimal.atCategoryCode ?? "";


            document.getElementById("eBreed").value =
                currentAnimal.breed ?? "";


            sourceTypeChanged();


            document.getElementById("editCard").style.display =
                "block";


            document.getElementById("editCard").scrollIntoView({
                behavior: "smooth"
            });


            updateSaveButton();
        }


        // ==========================================
        // LOAD CATEGORIES
        // ==========================================

        async function loadCategories() {

            const response = await fetch(
                "/api/category",
                {
                    headers: {
                        "app-version": "2"
                    }
                }
            );


            if (!response.ok) {

                throw new Error(
                    "Unable to load categories."
                );
            }


            const categories =
                await response.json();


            const select =
                document.getElementById("eCategory");


            select.innerHTML =
                '<option value="">Select Category</option>';


            categories.forEach(category => {

                const option =
                    document.createElement("option");


                option.value =
                    category.atCategoryCode;


                option.textContent =
                    category.atCategoryName;


                select.appendChild(option);

            });
        }


        // ==========================================
        // LOAD BREEDS
        // ==========================================

        async function loadBreeds() {

            const response = await fetch(
                "/api/breed",
                {
                    headers: {
                        "app-version": "2"
                    }
                }
            );


            if (!response.ok) {

                throw new Error(
                    "Unable to load breeds."
                );
            }


            const breeds =
                await response.json();


            const select =
                document.getElementById("eBreed");


            select.innerHTML =
                '<option value="">Select Breed</option>';


            breeds.forEach(breed => {

                const option =
                    document.createElement("option");


                option.value =
                    breed.breedName;


                option.textContent =
                    breed.breedName;


                select.appendChild(option);

            });
        }


        // ==========================================
        // SOURCE TYPE
        // ==========================================

        function sourceTypeChanged() {

            const sourceType =
                document.getElementById("eSourceType").value;


            const purchaseDate =
                document.getElementById("ePurchaseDate");


            const price =
                document.getElementById("ePrice");


            const agentName =
                document.getElementById("eAgentName");


            const motherNumber =
                document.getElementById("eMotherNumber");


            const motherCode =
                document.getElementById("eMotherCode");


            if (sourceType === "PURCHASE") {

                purchaseDate.disabled =
                    false;

                price.disabled =
                    false;

                agentName.disabled =
                    false;


                motherNumber.value =
                    "";

                motherCode.value =
                    "";


                motherNumber.disabled =
                    true;

                motherCode.disabled =
                    true;


                motherLookupValid =
                    true;
            }

            else if (sourceType === "BORN") {

                purchaseDate.value =
                    "";

                price.value =
                    "";

                agentName.value =
                    "";


                purchaseDate.disabled =
                    true;

                price.disabled =
                    true;

                agentName.disabled =
                    true;


                motherNumber.disabled =
                    false;

                motherCode.disabled =
                    true;


                motherLookupValid =
                    !!motherNumber.value &&
                    !!motherCode.value;
            }

            else {

                purchaseDate.disabled =
                    false;

                price.disabled =
                    false;

                agentName.disabled =
                    false;


                motherNumber.disabled =
                    false;

                motherCode.disabled =
                    false;


                motherLookupValid =
                    true;
            }


            document.getElementById("eGender").disabled =
                false;

            document.getElementById("eCategory").disabled =
                false;

            document.getElementById("eDOB").disabled =
                false;

            document.getElementById("eBreed").disabled =
                false;


            updateSaveButton();
        }


        // ==========================================
        // MOTHER NUMBER → MOTHER CODE
        // ==========================================

        async function motherNumberChanged() {

            const input =
                document.getElementById("eMotherNumber");

            const motherCode =
                document.getElementById("eMotherCode");


            const motherNumber =
                input.value.trim();


            // ==========================================
            // EMPTY
            // ==========================================

            if (!motherNumber) {

                motherCode.value = "";

                motherLookupValid =
                    false;

                updateSaveButton();

                document.getElementById("message").style.display =
                    "none";

                return;
            }


            // ==========================================
            // OWN ANIMAL
            // ==========================================

            if (
                currentAnimal &&
                Number(motherNumber) ===
                Number(currentAnimal.animalNo)
            ) {

                motherCode.value = "";

                motherLookupValid =
                    false;

                updateSaveButton();

                showMessage(
                    "An animal cannot be its own mother.",
                    true
                );

                return;
            }


            // ==========================================
            // CURRENT REQUEST
            // ==========================================

            const requestedMotherNumber =
                motherNumber;


            // Disable Save while checking

            motherLookupValid =
                false;

            updateSaveButton();


            try {

                // ======================================
                // FIND MOTHER AT CODE
                // ======================================

                const response = await fetch(
                    `/api/animal/byanimalno/${encodeURIComponent(requestedMotherNumber)}`,
                    {
                        headers: {
                            "app-version": "2"
                        }
                    }
                );


                // User changed number while waiting

                if (
                    document.getElementById("eMotherNumber").value.trim()
                    !== requestedMotherNumber
                ) {
                    return;
                }


                // ======================================
                // NOT FOUND
                // ======================================

                if (!response.ok) {

                    motherCode.value = "";

                    motherLookupValid =
                        false;

                    updateSaveButton();

                    showMessage(
                        "Mother Animal No not found.",
                        true
                    );

                    return;
                }


                const result =
                    await response.json();


                if (
                    !result ||
                    !result.atCode
                ) {

                    motherCode.value = "";

                    motherLookupValid =
                        false;

                    updateSaveButton();

                    showMessage(
                        "Mother Animal No not found.",
                        true
                    );

                    return;
                }


                // ======================================
                // GET MOTHER DETAILS
                // ======================================

                const motherResponse =
                    await fetch(
                        `/api/animal/${encodeURIComponent(result.atCode)}`,
                        {
                            headers: {
                                "app-version": "2"
                            }
                        }
                    );


                // User changed number while waiting

                if (
                    document.getElementById("eMotherNumber").value.trim()
                    !== requestedMotherNumber
                ) {
                    return;
                }


                if (!motherResponse.ok) {

                    motherCode.value = "";

                    motherLookupValid =
                        false;

                    updateSaveButton();

                    showMessage(
                        "Unable to verify mother.",
                        true
                    );

                    return;
                }


                const mother =
                    await motherResponse.json();


                // ======================================
                // MUST BE FEMALE
                // ======================================

                if (
                    !mother.gender ||
                    mother.gender.toLowerCase() !== "female"
                ) {

                    motherCode.value = "";

                    motherLookupValid =
                        false;

                    updateSaveButton();

                    showMessage(
                        "Selected Mother Animal No is not female.",
                        true
                    );

                    return;
                }


                // ======================================
                // FINAL INPUT CHECK
                // ======================================

                if (
                    document.getElementById("eMotherNumber").value.trim()
                    !== requestedMotherNumber
                ) {
                    return;
                }


                // ======================================
                // VALID MOTHER
                // ======================================

                motherCode.value =
                    result.atCode;


                motherLookupValid =
                    true;


                updateSaveButton();


                document.getElementById("message").style.display =
                    "none";

            }
            catch (error) {

                if (
                    document.getElementById("eMotherNumber").value.trim()
                    !== requestedMotherNumber
                ) {
                    return;
                }


                motherCode.value = "";

                motherLookupValid =
                    false;

                updateSaveButton();


                showMessage(
                    "Error verifying mother: " +
                    error.message,
                    true
                );
            }
        }


        // ==========================================
        // SAVE ANIMAL
        // ==========================================

        async function saveAnimal() {

            if (!currentAnimal) {
                return;
            }


            const saveButton =
                document.getElementById("saveButton");


            // Extra protection

            if (saveButton.disabled) {

                showMessage(
                    "Please correct the validation errors before saving.",
                    true
                );

                return;
            }


            const sourceType =
                document.getElementById("eSourceType").value;


            const motherNumber =
                document.getElementById("eMotherNumber").value.trim();


            const motherCode =
                document.getElementById("eMotherCode").value.trim();


            // ==========================================
            // BORN VALIDATION
            // ==========================================

            if (sourceType === "BORN") {

                if (!motherNumber) {

                    motherLookupValid =
                        false;

                    updateSaveButton();

                    showMessage(
                        "Please enter Mother Animal No.",
                        true
                    );

                    return;
                }


                if (
                    Number(motherNumber) ===
                    Number(currentAnimal.animalNo)
                ) {

                    motherLookupValid =
                        false;

                    updateSaveButton();

                    showMessage(
                        "An animal cannot be its own mother.",
                        true
                    );

                    return;
                }


                if (
                    !motherLookupValid ||
                    !motherCode
                ) {

                    motherLookupValid =
                        false;

                    updateSaveButton();

                    showMessage(
                        "Please enter a valid female Mother Animal No.",
                        true
                    );

                    return;
                }
            }


            // ==========================================
            // MODEL
            // ==========================================

            const model = {

                ATCode:
                    document.getElementById("eATCode").value,

                gender:
                    document.getElementById("eGender").value,

                ATCategoryCode:
                    document.getElementById("eCategory").value,

                DOB:
                    document.getElementById("eDOB").value ||
                    null,

                SourceType:
                    sourceType ||
                    null,

                PurchaseDate:
                    document.getElementById("ePurchaseDate").value ||
                    null,

                Price:
                    document.getElementById("ePrice").value
                        ? Number(
                            document.getElementById("ePrice").value
                        )
                        : null,

                AgentName:
                    document.getElementById("eAgentName").value ||
                    null,

                MotherCode:
                    document.getElementById("eMotherCode").value ||
                    null,

                MotherNumber:
                    document.getElementById("eMotherNumber").value
                        ? Number(
                            document.getElementById("eMotherNumber").value
                        )
                        : null,

                Breed:
                    document.getElementById("eBreed").value ||
                    null
            };


            // ==========================================
            // SAVE
            // ==========================================

            try {

                const response = await fetch(
                    "/api/animal/save",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json",
                            "app-version": "2"
                        },

                        body: JSON.stringify(model)
                    }
                );


                if (!response.ok) {

                    const errorText =
                        await response.text();


                    showMessage(
                        "Save failed: " +
                        errorText,
                        true
                    );

                    return;
                }


                showMessage(
                    "Goat updated successfully.",
                    false
                );


                await loadAnimalDetails(
                    model.ATCode
                );


                document.getElementById("editCard").style.display =
                    "none";

            }
            catch (error) {

                showMessage(
                    "Error saving goat: " +
                    error.message,
                    true
                );
            }
        }


        // ==========================================
        // CANCEL
        // ==========================================

        function cancelEdit() {

            document.getElementById("editCard").style.display =
                "none";
        }


        // ==========================================
        // DATE FOR INPUT
        // ==========================================

        function toInputDate(value) {

            if (!value) {
                return "";
            }

            return value.substring(0, 10);
        }


        // ==========================================
        // DISPLAY DATE
        // ==========================================

        function formatDate(value) {

            if (!value) {
                return "-";
            }


            const date =
                new Date(value);


            if (isNaN(date.getTime())) {
                return "-";
            }


            const day =
                String(date.getDate()).padStart(2, "0");


            const months = [
                "Jan", "Feb", "Mar", "Apr",
                "May", "Jun", "Jul", "Aug",
                "Sep", "Oct", "Nov", "Dec"
            ];


            const month =
                months[date.getMonth()];


            const year =
                date.getFullYear();


            return `${day}/${month}/${year}`;
        }


        // ==========================================
        // MESSAGE
        // ==========================================

        function showMessage(text, error) {

            // REAL POPUP ALERT
            if (error) {
                alert(text);
                return;
            }

            // Keep successful messages on the page
            const message =
                document.getElementById("message");

            message.textContent =
                text;

            message.className =
                "message success";

            message.style.display =
                "block";
        }

    </script>
